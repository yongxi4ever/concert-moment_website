<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人演唱会纪念网站</title>
  <style>
    :root{
      --bg: #f8fbff;
      --panel: #ffffff;
      --text: #1b1b1b;
      --soft-blue: #d8e8ff;
      --badge: #ffd56a;
      --ticket-yellow-border: #ffd98a;
      --ticket-yellow: #fff6c8;
      --card-border: #e6e6e6;
      --shadow: 0 6px 14px rgba(0,0,0,.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: var(--text);
      background: radial-gradient(circle at 10% -10%, rgba(255, 210, 230, 0.6), transparent 40%),
                  radial-gradient(circle at 90% 0%, rgba(214, 234, 255, 0.6), transparent 40%),
                  linear-gradient(#f8fbff, #f4f8ff);
      padding: 20px;
    }

    header.site-header {
      text-align: center;
      margin: 8px auto 14px;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 208, 230, 0.25), rgba(210, 235, 255, 0.25));
      border: 1px solid rgba(255, 180, 220, .6);
    }

    header.site-header h1 {
      margin: 6px 0 0;
      font-size: 26px;
      font-weight: 800;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      max-width: 1100px;
      margin: 0 auto;
    }

    section.card {
      background: var(--panel);
      border: 1px solid var(--card-border);
      border-radius: calc(var(--radius) + 2px);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      color: #333;
      margin-bottom: 12px;
    }

    /* Forms */
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-bottom: 8px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; margin-bottom: 8px; }

    input[type="text"], input[type="date"] {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #dcdcdc; background: #fff; font-size: 14px;
    }
    input[type="date"] { padding: 8px 10px; }

    button.btn { padding: 9px 14px; border: none; border-radius: 8px; background: #8ec8f7; color: #083a75; font-weight: 600; cursor: pointer; }
    button.btn.secondary { background: #f0f0f0; color: #333; }
    button.btn.danger { background: #ff6b6b; color: white; }

    /* 1) 已看过的演唱会 (票根风格, 浅黄) */
    #seen-list .ticket {
      position: relative;
      display: block;
      background: linear-gradient(#fff9d6 0 60%, #fff0bf 60% 100%);
      border: 2px solid var(--ticket-yellow-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin: 12px 0;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    /* 现场照片居中：使用弹性布局容器包裹照片区域 */
    #seen-list .photos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }
    /* 每张照片的拍立得样式 */
    .polaroid {
      width: 170px; height: 140px;
      padding: 8px 8px 20px;
      background: #fff;
      border: 6px solid #fff;
      border-radius: 6px;
      box-shadow: 0 6px 14px rgba(0,0,0,.25);
      transform: rotate(-1.5deg);
      display: inline-block;
    }
    .polaroid img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; }
    .polaroid-caption { text-align: center; font-size: 11px; color: #555; margin-top: 4px; }

    /* 编辑区域（默认隐藏，点击“修改图片”后再显示） */
    .photo-controls { display: none; margin-top: 6px; gap: 6px; justify-content: center; display: flex; flex-wrap: wrap; }

    /* 2) 即将去看的演唱会 (票根, 浅清新) */
    #upcoming-list .ticket {
      background: linear-gradient(#e6f7ff 0 60%, #f0fffb 60% 100%);
      border-color: #bfe7f9;
    }
    #upcoming-list .countdown { font-weight: 700; color: #0b6b97; margin-top: 6px; }

    /* 3) 想看的演唱会（愿望清单） */
    #wish-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    #wish-list .card { border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; background: #fff; }
    #wish-list .card h4 { margin: 0 0 6px; font-size: 15px; }
    #wish-list .card .muted { color: #666; font-size: 12px; }

    /* 4) 总结（统计面板） */
    #stats-section { display: block; }
    #stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .stat { background: #fff; border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; text-align: center; }
    .stat .value { font-size: 22px; font-weight: 800; color: #1a2a3a; }
    .stat .label { font-size: 12px; color: #555; }

    /* 5) 按钮尺寸增大美化 */
    .module-stack { width: 100%; }
    .module-btn {
      padding: 14px 20px; font-size: 18px; border-radius: 10px;
      border: 1px solid #d9d9d9; background: #f7fbff; cursor: pointer; text-align: center;
    }
    .module-btn.active { background: #e8f2ff; border-color: #a5d0ff; font-weight: 700; }

    @media (min-width: 860px){
      .container { grid-template-columns: 1fr; }
    }

    @media (max-width: 859px){
      .row, .row-3 { grid-template-columns: 1fr; }
      #wish-list { grid-template-columns: 1fr; }
      .module-section { display: none; }
    }

    /* 返回首页区域按钮定位 */
    .module-header { display: flex; justify-content: flex-start; margin-bottom: 6px; }

    /* 辅助文本（无障碍） */
    .sr-only { position: absolute; left: -9999px; }

    /* 其他小工具 */
    .ticket-controls { margin-top: 6px; display: flex; gap: 8px; align-items: center; }

  </style>
</head>
<body>
  <header class="site-header" aria-label="站头">
    <div style="font-size:26px; font-weight:800;">个人演唱会纪念网站</div>
  </header>

  <main class="container" id="app">
    <!-- 三大模块入口：大按钮，竖直排列 -->
    <section class="card" id="module-switcher" aria-label="模块开关" style="display:block;">
      <div class="module-stack" style="display:flex;flex-direction:column;gap:8px;">
        <button class="module-btn" data-module="seen" type="button">已看过的演唱会</button>
        <button class="module-btn" data-module="upcoming" type="button">即将去看的演唱会</button>
        <button class="module-btn" data-module="wishlist" type="button">想看的演唱会</button>
      </div>
    </section>

    <!-- 1) 已看过的演唱会 -->
    <section class="card module-section" id="seen-section" style="display:none;">
      <div class="module-header" style="margin-bottom:8px;">
        <button class="btn" data-action="home" type="button">返回首页</button>
      </div>
      <div class="section-title" style="margin-top:4px;">已看过的演唱会 🎫</div>

      <!-- 新增记录 -->
      <form id="form-seen" class="row" autocomplete="off">
        <input type="text" id="seen-artist" placeholder="歌手/乐队" required />
        <input type="text" id="seen-name" placeholder="演唱会名称" required />
        <input type="date" id="seen-date" required />
        <input type="text" id="seen-city" placeholder="城市" required />
        <input type="text" id="seen-venue" placeholder="场馆" required />
        <button class="btn" type="submit" style="height:38px;">新增记录</button>
      </form>

      <!-- 排序控件（放在新增记录下方） -->
      <div id="seen-sort-controls" style="display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:8px 0 12px;">
        <span style="font-size:14px;">排序：</span>
        <select id="seen-sort" aria-label="排序方式">
          <option value="date-desc">按演出时间倒序</option>
          <option value="artist-asc">按歌手字母顺序（同歌手按时间倒序）</option>
        </select>
      </div>

      <div id="seen-list" aria-label="已看过的演唱会列表"></div>
    </section>

    <!-- 2) 即将去看的演唱会 -->
    <section class="card module-section" id="upcoming-section" style="display:none;">
      <div class="module-header" style="margin-bottom:8px;">
        <button class="btn" data-action="home" type="button">返回首页</button>
      </div>
      <div class="section-title" style="margin-top:4px;">即将去看的演唱会 ⏳</div>
      <form id="form-upcoming" class="row-3" autocomplete="off">
        <input type="text" id="up-artist" placeholder="歌手/乐队" required />
        <input type="text" id="up-name" placeholder="演唱会名称" required />
        <input type="date" id="up-date" required />
        <input type="text" id="up-city" placeholder="城市" required />
        <input type="text" id="up-venue" placeholder="场馆" required />
        <button class="btn" type="submit" style="height:38px;">新增记录</button>
      </form>

      <div id="upcoming-list" aria-label="即将看演唱会列表"></div>
    </section>

    <!-- 3) 想看的演唱会（愿望清单） -->
    <section class="card module-section" id="wish-section" style="display:none;">
      <div class="module-header" style="margin-bottom:8px;">
        <button class="btn" data-action="home" type="button">返回首页</button>
      </div>
      <div class="section-title" style="margin-top:4px;">想看的演唱会（愿望清单）</div>
      <form id="form-wish" class="row" autocomplete="off">
        <input type="text" id="wish-artist" placeholder="歌手/乐队" required />
        <input type="text" id="wish-name" placeholder="演唱会名称" required />
        <button class="btn" type="submit" style="height:38px;">新增到愿望</button>
      </form>

      <div id="wish-list" aria-label="愿望清单列表"></div>
      <!-- 说明：愿望清单仅记录歌手/演唱会名称；可标记完成，或转为即将观看 -->
    </section>

    <!-- 4) 总结（统计面板） -->
    <section id="stats-section" class="card" style="min-height: 180px;">
      <div class="section-title" style="font-weight:800; letter-spacing:0.5px;">总结</div>
      <div id="stats">
        <div class="stat">
          <div class="value" id="stat-seen">0</div>
          <div class="label">已看场次</div>
        </div>
        <div class="stat">
          <div class="value" id="stat-upcoming">0</div>
          <div class="label">将要看的场次</div>
        </div>
        <div class="stat">
          <div class="value" id="stat-wishlist">0</div>
          <div class="label">想看的数量</div>
        </div>
        <div class="stat" id="stat-unique">
          <div class="value" id="stat-unique-label">0</div>
          <div class="label">已看过的歌手数</div>
        </div>
        <div class="stat" id="stat-cities">
          <div class="value" id="stat-cities-label">0</div>
          <div class="label">观演城市数</div>
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:12px; flex-wrap: wrap;">
        <div id="stat-recent" class="stat" style="min-width:180px;">
          <div class="value" id="stat-recent-label">最近一场已看：暂无</div>
          <div class="label" style="font-size:12px; margin-top:4px;">最近一场演唱会信息</div>
        </div>
        <div id="stat-favorites" class="stat" style="min-width:180px;">
          <div class="value" id="stat-favorites-label">最期待的一场：暂无</div>
          <div class="label" style="font-size:12px; margin-top:4px;">最靠近的即将演出</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 应用状态（本地存储）
    const STORAGE_KEY = 'concertMemories_v1';
    const state = {
      seen: [],       // 已看过的演唱会
      upcoming: [],   // 即将看
      wishlist: [],   // 想看的
      seenSortMode: 'date-desc' // seen 模块排序模式
    };

    // 唯一ID生成
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

    // 日期格式化
    const formatDateDisplay = (iso) => {
      try {
        const d = new Date(iso);
        const yyyy = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${m}-${day}`;
      } catch {
        return iso;
      }
    };

    // 计算天数差（用于倒计时）
    const daysUntil = (isoDate) => {
      const msPerDay = 24*60*60*1000;
      const now = new Date();
      const target = new Date(isoDate);
      const diff = target.setHours(0,0,0,0) - new Date(now.getFullYear(), now.getMonth(), now.getDate()).setHours(0,0,0,0);
      return Math.ceil(diff / msPerDay);
    };

    // DOM helpers
    const el = (sel) => document.querySelector(sel);
    const els = (sel) => Array.from(document.querySelectorAll(sel));

    // 载入本地数据
    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          Object.assign(state, parsed);
        } catch (e) {
          console.error('加载存档失败', e);
        }
      }
      if (!state.seenSortMode) state.seenSortMode = 'date-desc';
    }

    // 保存当前状态
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 清空所有数据
    function clearAll() {
      if (!confirm('清空所有数据吗？此操作不可撤销。')) return;
      state.seen = [];
      state.upcoming = [];
      state.wishlist = [];
      saveState();
      renderAll();
    }

    // 排序辅助：已看过的演唱会排序
    function sortSeenList(list) {
      const mode = state.seenSortMode || 'date-desc';
      const arr = list.slice();
      if (mode === 'date-desc') {
        // 时间倒序
        return arr.sort((a,b) => new Date(b.date) - new Date(a.date));
      } else if (mode === 'artist-asc') {
        return arr.sort((a,b) => {
          const an = (a.artist || '').toLowerCase();
          const bn = (b.artist || '').toLowerCase();
          if (an !== bn) return an < bn ? -1 : 1;
          // 同歌手，按时间倒序
          return new Date(b.date) - new Date(a.date);
        });
      }
      return arr;
    }

    // 渲染入口
    function renderAll() {
      renderSeen();
      renderUpcoming();
      renderWishlist();
      renderStats();
    }

    // 渲染“已看过”的演唱会
    function renderSeen() {
      const container = document.getElementById('seen-list');
      if (!container) return;
      container.innerHTML = '';
      const sorted = sortSeenList(state.seen);

      sorted.forEach(item => {
        // 票根块
        const card = document.createElement('div');
        card.className = 'ticket';
        card.innerHTML = `
          <div class="ticket-header" style="margin-bottom:6px;">
            <span class="badge" aria-label="票根" title="票根">🎫</span>
            <span class="artist">${escapeHtml(item.artist)}</span>
            <span>・</span>
            <span class="concert" title="${escapeHtml(item.name)}" style="font-weight:700;">${escapeHtml(item.name)}</span>
          </div>
          <div class="ticket-meta">
            <span>${formatDateDisplay(item.date)}</span>
            <span>•</span>
            <span>${escapeHtml(item.city || '')}</span>
            <span>•</span>
            <span>${escapeHtml(item.venue || '')}</span>
          </div>
          <div class="photos" id="photos_seen_${item.id}"></div>
        `;
        container.appendChild(card);

        // 现场照片区域（居中显示，最多3张）
        renderPhotosForSeen(item.id, item.editMode === true);

        // 票根下方的“修改图片”与“保存”按钮区域
        const editorRow = document.createElement('div');
        editorRow.style.textAlign = 'center';
        editorRow.style.marginTop = '6px';
        editorRow.innerHTML = `
          <button class="btn toggle-edit-seen" data-id="${item.id}">修改图片</button>
          <button class="btn save-seen" data-id="${item.id}" style="margin-left:8px; display:none;">保存</button>
          <button class="btn" data-action="add-photos" data-id="${item.id}" style="margin-left:6px; display:none;">新增照片</button>
          <input type="file" accept="image/*" multiple class="hidden-add" data-id="${item.id}" style="display:none" />
        `;
        container.appendChild(editorRow);

        // 绑定编辑按钮的初始状态
        // 根据 item.editMode 显示/隐藏相关控件
        if (item.editMode) {
          editorRow.querySelector('.toggle-edit-seen').style.display = 'none';
          editorRow.querySelector('.save-seen').style.display = 'inline-block';
          editorRow.querySelector('[data-action="add-photos"]').style.display = 'inline-block';
          // 展开照片编辑控件（若存在）
          const editors = document.querySelectorAll('#photos_seen_' + item.id + ' .photo-controls');
          editors.forEach(el => el.style.display = 'flex');
        } else {
          editorRow.querySelector('.toggle-edit-seen').style.display = 'inline-block';
          editorRow.querySelector('.save-seen').style.display = 'none';
          editorRow.querySelector('[data-action="add-photos"]').style.display = 'none';
          // 隐藏照片编辑控件
          const editors = document.querySelectorAll('#photos_seen_' + item.id + ' .photo-controls');
          editors.forEach(el => el.style.display = 'none');
        }
      });

      // 更新排序选择框的当前值
      const seenSort = document.getElementById('seen-sort');
      if (seenSort) seenSort.value = state.seenSortMode;
    }

    // 渲空间：渲染照片区，编辑时显示按钮，非编辑时只显示图片
    function renderPhotosForSeen(id, editing){
      const item = state.seen.find(s => s.id === id);
      const container = document.getElementById('photos_seen_' + id);
      if (!item || !container) return;
      container.innerHTML = '';

      const photos = item.photos || [];
      // 只展示最近的3张
      const displayPhotos = photos.slice(0, 3);

      displayPhotos.forEach((src, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'polaroid';
        wrap.style = 'display:inline-block;';
        wrap.innerHTML = `<img src="${src}" alt="现场照片 ${idx+1}" />`;
        // 照片容器
        container.appendChild(wrap);

        // 编辑区（仅在 editing 时显示）
        if (editing) {
          const ctrl = document.createElement('div');
          ctrl.className = 'photo-controls';
          ctrl.style.display = 'flex';
          ctrl.style.gap = '6px';
          ctrl.style.marginTop = '6px';
          ctrl.innerHTML = `
            <button class="btn" data-action="replace-photo" data-id="${id}" data-idx="${idx}">替换</button>
            <button class="btn" data-action="move-up-photo" data-id="${id}" data-idx="${idx}">上移</button>
            <button class="btn" data-action="move-down-photo" data-id="${id}" data-idx="${idx}">下移</button>
            <button class="btn danger" data-action="delete-photo" data-id="${id}" data-idx="${idx}">删除</button>
            <input type="file" accept="image/*" class="hidden-input" data-id="${id}" data-idx="${idx}" style="display:none" />
          `;
          container.appendChild(ctrl);
        }
      });

      // 若编辑状态且照片少于3张，提供“新增照片”入口
      // 只在 editing 时显示
      const editorArea = document.getElementById('photo-editor-seen-controls_' + id);
      // 如果需要，这里可以拓展，当前实现通过外部按钮控制
    }

    // 渲染“即将看”的演唱会
    function renderUpcoming() {
      const container = document.getElementById('upcoming-list');
      container.innerHTML = '';
      state.upcoming.forEach(item => {
        const card = document.createElement('div');
        card.className = 'ticket';
        card.innerHTML = `
          <div class="ticket-header" style="margin-bottom:6px;">
            <span class="badge" aria-label="票根" title="票根" style="background: linear-gradient(#fff, #c8f2ff); border-color:#a1e5ff;">🎟️</span>
            <span class="artist"><strong>${escapeHtml(item.artist)}</strong></span>
            <span>・</span>
            <span class="concert" style="font-weight:700;">${escapeHtml(item.name)}</span>
          </div>
          <div class="ticket-meta">
            <span>${formatDateDisplay(item.date)}</span>
            <span>•</span>
            <span>${escapeHtml(item.city || '')}</span>
            <span>•</span>
            <span>${escapeHtml(item.venue || '')}</span>
          </div>
          <div class="countdown" data-id="${item.id}"></div>
          <div style="margin-top:8px; text-align:right;">
            <button class="btn secondary" data-action="remove-upcoming" data-id="${item.id}" style="height:32px;">删除</button>
          </div>
        `;
        container.appendChild(card);
      });

      // 初始化/刷新倒计时
      updateCountdowns();
    }

    // 更新所有Upcoming倒计时
    function updateCountdowns() {
      const now = new Date();
      state.upcoming.forEach(it => {
        const diffDays = daysUntil(it.date);
        const elCount = document.querySelector(`.countdown[data-id="${it.id}"]`);
        if (elCount) {
          if (diffDays > 0) {
            elCount.textContent = `距离演出还有 ${diffDays} 天`;
          } else if (new Date(it.date).toDateString() === now.toDateString()) {
            elCount.textContent = '今天开演';
          } else {
            elCount.textContent = '已过期';
          }
        }
      });
    }

    // 渲染愿望清单
    function renderWishlist() {
      const container = document.getElementById('wish-list');
      container.innerHTML = '';
      state.wishlist.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h4>${escapeHtml(item.artist)} — ${escapeHtml(item.name)}</h4>
          <div class="muted" style="color:#666; font-size:12px; margin-bottom:6px;">
            记录仅包含歌手/演唱会名称
          </div>
          <div style="display:flex; gap:8px; flex-wrap: wrap;">
            <button class="btn" data-action="wishlist-move" data-id="${item.id}" style="height:32px;">转为即将观看</button>
            <label style="display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#555;">
              <input type="checkbox" data-id="${item.id}" data-action="wishlist-complete" />完成
            </label>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 渲染统计面板，总结
    function renderStats() {
      document.getElementById('stat-seen').textContent = state.seen.length;
      document.getElementById('stat-upcoming').textContent = state.upcoming.length;
      document.getElementById('stat-wishlist').textContent = state.wishlist.length;

      // 最近一场已看
      const recent = [...state.seen].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
      const recentEl = document.getElementById('stat-recent-label');
      if (recent) {
        recentEl.textContent = `最近一场已看：${recent.artist} - ${recent.name} (${formatDateDisplay(recent.date)})`;
      } else {
        recentEl.textContent = '最近一场已看：暂无';
      }

      // 独特歌手数
      const uniqueArtists = new Set(state.seen.map(s => (s.artist || '').toString().toLowerCase().trim())).size;
      const uniqueEl = document.getElementById('stat-unique-label');
      uniqueEl.textContent = String(uniqueArtists || 0);

      // 观演城市数
      const citiesUnique = new Set(
        state.seen
          .map(s => (s.city || '').toString().toLowerCase().trim())
          .filter(c => c) // 去掉空字符串
      ).size;
      const citiesEl = document.getElementById('stat-cities-label');
      citiesEl && (citiesEl.textContent = String(citiesUnique));

      // 最近的 upcoming
      const upcomingSoon = [...state.upcoming].sort((a,b) => new Date(a.date) - new Date(b.date))[0];
      const favEl = document.getElementById('stat-favorites-label');
      if (upcomingSoon) {
        favEl.textContent = `最期待：${upcomingSoon.artist} - ${upcomingSoon.name} (${formatDateDisplay(upcomingSoon.date)})`;
      } else {
        favEl.textContent = '最期待：暂无';
      }
    }

    // 安全输出文本
    function escapeHtml(s){
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 表单事件处理
    function initEventHandlers(){
      // 模块开关按钮事件
      const moduleBtns = Array.from(document.querySelectorAll('.module-btn'));
      moduleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const module = btn.getAttribute('data-module');
          showModule(module);
          moduleBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // 已看新增
      document.getElementById('form-seen').addEventListener('submit', (e) => {
        e.preventDefault();
        const artist = document.getElementById('seen-artist').value.trim();
        const name = document.getElementById('seen-name').value.trim();
        const date = document.getElementById('seen-date').value;
        const city = document.getElementById('seen-city').value.trim();
        const venue = document.getElementById('seen-venue').value.trim();
        if(!artist || !name || !date) return;

        state.seen.unshift({ id: uid(), artist, name, date, city, venue, photos: [], editMode: false });
        saveState();
        renderAll();
        document.getElementById('form-seen').reset();
      });

      // 即将看新增
      document.getElementById('form-upcoming').addEventListener('submit', (e) => {
        e.preventDefault();
        const artist = document.getElementById('up-artist').value.trim();
        const name = document.getElementById('up-name').value.trim();
        const date = document.getElementById('up-date').value;
        const city = document.getElementById('up-city').value.trim();
        const venue = document.getElementById('up-venue').value.trim();
        if(!artist || !name || !date) return;

        state.upcoming.unshift({ id: uid(), artist, name, date, city, venue });
        saveState();
        renderAll();
        document.getElementById('form-upcoming').reset();
      });

      // 愿望表单
      document.getElementById('form-wish').addEventListener('submit', (e) => {
        e.preventDefault();
        const artist = document.getElementById('wish-artist').value.trim();
        const name = document.getElementById('wish-name').value.trim();
        if(!artist || !name) return;

        state.wishlist.unshift({ id: uid(), artist, name });
        saveState();
        renderAll();
        document.getElementById('form-wish').reset();
      });

      // 事件委托：按钮行动
      document.addEventListener('click', (e) => {
        const t = e.target;
        if (t.matches('[data-action="home"]')) {
          showModule(null);
        }
        if (t.matches('[data-action="remove-seen"]')) {
          const id = t.getAttribute('data-id');
          state.seen = state.seen.filter(s => s.id !== id);
          saveState();
          renderAll();
        }
        if (t.matches('[data-action="remove-upcoming"]')) {
          const id = t.getAttribute('data-id');
          state.upcoming = state.upcoming.filter(u => u.id !== id);
          saveState();
          renderAll();
        }
        if (t.matches('[data-action="wishlist-move"]')) {
          const id = t.getAttribute('data-id');
          const w = state.wishlist.find(w => w.id === id);
          if (w) {
            const date = prompt('请输入演唱会日期（YYYY-MM-DD）以转为即将观看：', new Date().toISOString().slice(0,10));
            const city = prompt('城市（可留空）', '');
            const venue = prompt('场馆（可留空）', '');
            if (date) {
              state.upcoming.unshift({ id: uid(), artist: w.artist, name: w.name, date, city: city || '', venue: venue || '' });
              state.wishlist = state.wishlist.filter(x => x.id !== id);
              saveState();
              renderAll();
            }
          }
        }
        // 完成愿望
        if (t.matches('[data-action="wishlist-complete"]')) {
          const id = t.getAttribute('data-id');
          const idx = state.wishlist.findIndex(w => w.id === id);
          if (idx >= 0) {
            state.wishlist.splice(idx, 1);
            saveState();
            renderAll();
          }
        }
        // 切换编辑状态：逐条控制
        if (t.matches('.toggle-edit-seen')) {
          const id = t.getAttribute('data-id');
          const item = state.seen.find(s => s.id === id);
          if (item) {
            item.editMode = true;
            saveState();
            renderAll();
          }
        }
        if (t.matches('.save-seen')) {
          const id = t.getAttribute('data-id');
          const item = state.seen.find(s => s.id === id);
          if (item) {
            item.editMode = false;
            saveState();
            renderAll();
          }
        }
        if (t.matches('[data-action="add-photos"]')) {
          // 通过全局隐藏输入添加照片
          currentEditingSeenId = t.getAttribute('data-id');
          const input = document.querySelector(`input.hidden-add[data-id="${currentEditingSeenId}"]`);
          if (input) input.click();
        }
        // 替换/上移/下移/删除照片（仅在编辑模式中有效）
        if (t.matches('[data-action="replace-photo"]') || t.matches('[data-action="move-up-photo"]') || t.matches('[data-action="move-down-photo"]') || t.matches('[data-action="delete-photo"]')) {
          const id = t.getAttribute('data-id');
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const item = state.seen.find(s => s.id === id);
          if (!item || !item.photos) return;
          if (t.matches('[data-action="replace-photo"]')) {
            // 触发对应的替换输入
            const input = document.querySelector(`input.hidden-input[data-id="${id}"][data-idx="${idx}"]`);
            if (input) input.click();
          } else if (t.matches('[data-action="move-up-photo"]')) {
            if (idx > 0) {
              const arr = item.photos;
              [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
              saveState();
              renderPhotosForSeen(id, true);
            }
          } else if (t.matches('[data-action="move-down-photo"]')) {
            if (idx < item.photos.length - 1) {
              const arr = item.photos;
              [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]];
              saveState();
              renderPhotosForSeen(id, true);
            }
          } else if (t.matches('[data-action="delete-photo"]')) {
            if (idx >= 0 && idx < item.photos.length) {
              item.photos.splice(idx, 1);
              saveState();
              renderPhotosForSeen(id, true);
            }
          }
        }
      });

      // 上传图片（新增照片）
      document.addEventListener('change', (e) => {
        const el = e.target;
        // 新增照片（全局隐藏输入）触发
        if (el && el.classList.contains('hidden-add') && el.dataset.id) {
          const id = el.dataset.id;
          const files = Array.from(el.files || []);
          if (files.length === 0) return;
          const item = state.seen.find(s => s.id === id);
          if (!item) return;

          const existing = item.photos.length;
          const canAdd = Math.max(0, 3 - existing);
          const toAdd = files.slice(0, canAdd);

          let count = toAdd.length;
          toAdd.forEach((f) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              item.photos.push(ev.target.result);
              saveState();
              renderPhotosForSeen(id, true);
              count--;
              if (count === 0) {
                // 清空输入
                el.value = '';
              }
            };
            reader.readAsDataURL(f);
          });
        }

        // 替换照片输入
        if (el && el.classList.contains('hidden-input') && el.dataset.id) {
          const id = el.dataset.id;
          const idx = parseInt(el.dataset.idx, 10);
          const files = Array.from(el.files || []);
          if (files.length === 0) return;
          const item = state.seen.find(s => s.id === id);
          if (!item) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            item.photos[idx] = ev.target.result;
            saveState();
            renderPhotosForSeen(id, true);
          };
          reader.readAsDataURL(files[0]);
        }
      });
    }

    // 模块切换顶部全局变量
    let currentEditingSeenId = null;

    // 初始化区域
    function init(){
      loadState();
      initEventHandlers();
      renderAll();
      setInterval(() => {
        renderAll();
      }, 60 * 1000);
      showModule(null);
    }

    // 显示模块，null 为首页
    function showModule(moduleName){
      const modules = ['seen','upcoming','wishlist'];
      const switcher = document.getElementById('module-switcher');
      const mapSectionId = (name) => (name === 'wishlist') ? 'wish-section' : name + '-section';

      if (!moduleName) {
        document.querySelectorAll('.module-section').forEach(sec => sec.style.display = 'none');
        if (switcher) switcher.style.display = 'block';
        document.querySelectorAll('.module-btn').forEach(btn => btn.classList.remove('active'));
        const statsSection = document.getElementById('stats-section');
        if (statsSection) statsSection.style.display = 'block';
        return;
      }

      modules.forEach(m => {
        const sec = document.getElementById(mapSectionId(m));
        if (sec) sec.style.display = (m === moduleName) ? 'block' : 'none';
      });

      if (switcher) switcher.style.display = 'none';
      document.querySelectorAll('.module-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-module') === moduleName);
      });

      // 首页的总结区块在进入其他板块时隐藏
      const statsSection = document.getElementById('stats-section');
      if (statsSection) statsSection.style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 启动
    init();
  </script>

  <!-- 快速清空演示数据 -->
  <button onclick="clearAll()" style="position:fixed; right:12px; bottom:12px; padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer;">
    清空演示数据
  </button>

</body>
</html>
